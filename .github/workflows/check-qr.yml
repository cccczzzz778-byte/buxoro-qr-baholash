name: Check QR Baholash
on:
  pull_request:
  push:
    branches: [main, feature/bolimlar-shifokorlar]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check
      - name: JavaScript syntax check
        run: |
          node --check server/application.mjs
          node --check server/district-application.mjs
          node --check server/feedback-submit.mjs
          node --check public/assets/app.js
          node --check public/assets/departments.js
